name: buildlunahook
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the zips to the 'LunaHook' GitHub release"
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/buildlunahook.yml'
      - 'src/scripts/build_lunahook.py'
      - 'src/NativeImpl/LunaHook/**'
      - 'src/NativeImpl/version.cmake'
      - 'src/NativeImpl/winxphelper.cmake'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win10
            arch: all
          - target: win7
            arch: all
          - target: winxp
            arch: x86
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python src/scripts/build_lunahook.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: LunaHook_${{ matrix.target }}
          path: src/NativeImpl/LunaHook/builds/Release_${{ matrix.target }}

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - run: |
          cd dist
          for d in */; do (cd "$d" && zip -9 -r "../${d%/}.zip" .); done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: LunaHook
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
